<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1530" height="970" viewBox="0 0 1530 970" role="img" aria-labelledby="title desc">
<title id="title">Spectral normalization and differential radial flow</title>
<desc id="desc">Three parallel curves demonstrate shifted zero crossings for spectral normalization intervals 0 to 10, 0.5 to 10 and 1 to 10 GeV, a common differential shape, and constant offsets.</desc>
<style>
.label { font-family: 'Times New Roman',Tinos,Times,serif; font-size:76px; fill:#111; font-weight:normal; }
.axislabel { font-family: 'Times New Roman',Tinos,Times,serif; font-size:94px; font-style:italic; fill:#111; }
.sub { font-family: 'Times New Roman',Tinos,Times,serif; font-size:58px; font-style:italic; fill:#111; }
.curve {stroke-width:6; stroke-linecap:round;fill:none;}
.axisstroke {stroke:#101010;stroke-width:4.2;fill:none;}
.annotation {stroke:#151515;stroke-width:3.8;fill:none;stroke-linejoin:round;stroke-linecap:round;}
</style>
<rect width="1530" height="970" fill="white"/>

