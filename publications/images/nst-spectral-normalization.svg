<path d="M145 755 L1470 284.62" stroke="#F20B8F" class="curve" id="line-pink"/>
<path d="M145 835 L1470 364.62" stroke="#117F1F" class="curve" id="line-green"/>
<circle cx="314.01" cy="615" r="13" fill="#0869F5"/>
<path d="M314.01 629 V792" stroke="#0869F5" stroke-width="3.8" stroke-dasharray="13 11" fill="none"/>
<circle cx="539.37" cy="615" r="13" fill="#F20B8F"/>
<path d="M539.37 629 V792" stroke="#F20B8F" stroke-width="3.8" stroke-dasharray="13 11" fill="none"/>
<circle cx="764.72" cy="615" r="13" fill="#117F1F"/>
<path d="M764.72 629 V792" stroke="#117F1F" stroke-width="3.8" stroke-dasharray="13 11" fill="none"/>
<path d="M314.01 805 Q314.01 851 339.01 851 L507.37 851 Q539.37 851 539.37 865 Q539.37 851 571.37 851 L739.72 851 Q764.72 851 764.72 805" class="annotation"/>
<text x="539.37" y="932" text-anchor="middle" class="label">Shifted zero crossing</text>
