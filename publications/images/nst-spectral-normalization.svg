<text x="396" y="285" class="label">0 – 10 GeV</text>
<path d="M205 344 H350" stroke="#F20B8F" stroke-width="8" stroke-linecap="round"/>
<text x="396" y="367" class="label">0.5 – 10 GeV</text>
<path d="M205 426 H350" stroke="#117F1F" stroke-width="8" stroke-linecap="round"/>
<text x="396" y="449" class="label">1 – 10 GeV</text>
