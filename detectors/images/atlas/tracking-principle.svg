<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" role="img" aria-labelledby="track-title track-desc">
<title id="track-title">How charged-particle tracking works in the original ATLAS Inner Detector</title>
<desc id="track-desc">Conceptual transverse view. Concentric Pixel and SCT silicon layers and outer TRT straw tubes surround the beam pipe. A single red curved charged-particle trajectory passes through eight colored measurement markers, two in Pixel, two in SCT and four in TRT. A separate legend explains each technology.</desc>
<defs><style>
.background{fill:#fbfcf9}
.title{font-family:'Times New Roman',Times,serif;fill:#315836;font-size:25px;font-weight:700}
.copy{font-family:'Times New Roman',Times,serif;fill:#4c604d;font-size:19px}
.legend-name{font-family:'Times New Roman',Times,serif;fill:#315836;font-size:23px;font-weight:700}
.legend-description{font-family:'Times New Roman',Times,serif;fill:#4c604d;font-size:19px}
.track{fill:none;stroke:#d9443c;stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round}
.pixel-mark{fill:#377fb8;stroke:#fff;stroke-width:3}
.sct-mark{fill:#7356b0;stroke:#fff;stroke-width:3}
.trt-mark{fill:#b67d20;stroke:#fff;stroke-width:3}
.footer{fill:#f0f6eb;stroke:#d0ddc5;stroke-width:1.2}
</style></defs>
