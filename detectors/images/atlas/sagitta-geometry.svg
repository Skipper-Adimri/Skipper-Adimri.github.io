<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 325" role="img" aria-labelledby="sg-title sg-desc">
<title id="sg-title">Sagitta method for estimating track curvature</title>
<desc id="sg-desc">A circular track fitted through measured points. The chord L joins the outer points. The sagitta s is the largest distance between the chord and arc, and R is the distance from the circle center to the arc. Right triangle geometry gives R squared equals (R minus s) squared plus (L over two) squared.</desc>
